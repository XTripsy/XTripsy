<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "XTripsy | Engine & Gameplay Programmer" }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23161b22'/><path d='M8 10L15 16L8 22' fill='none' stroke='%23e6edf3' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/><path d='M17 22H24' fill='none' stroke='%2358a6ff' stroke-width='3.2' stroke-linecap='round'/></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 24px 64px;
    }
    h1, h2, h3 {
      color: #e6edf3;
      border-bottom: 1px solid #21262d;
      padding-bottom: 0.3em;
      margin-top: 24px;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    pre {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 16px;
      overflow-x: auto;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13.5px;
      line-height: 1.5;
      color: #e6edf3;
    }
    code {
      font-family: "Consolas", "Courier New", monospace;
      background-color: rgba(110, 118, 129, 0.25);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 85%;
    }
    pre code {
      background-color: transparent;
      padding: 0;
      font-size: inherit;
    }
    details {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 16px 0;
    }
    summary { cursor: pointer; color: #e6edf3; }
    img, video { max-width: 100%; height: auto; border-radius: 6px; }
    hr { border: 0; border-top: 1px solid #30363d; margin: 24px 0; }

    /* Semantic Terminal Hierarchy */
    .t-user   { color: #7ee787; font-weight: bold; }
    .t-path   { color: #79c0ff; font-weight: bold; }
    .t-dim    { color: #6e7681; }
    .t-key    { color: #79c0ff; font-weight: bold; }
    .t-accent { color: #ffa657; font-weight: bold; }
    .t-hl     { color: #d2a8ff; font-weight: bold; }

    @media print {
      body {
        background-color: #ffffff;
        color: #1f2328;
        margin: 0;
        padding: 16px;
        max-width: 100%;
      }
      h1, h2, h3 {
        color: #1f2328;
        border-bottom-color: #d0d7de;
      }
      pre {
        background-color: #f6f8fa;
        border-color: #d0d7de;
        color: #1f2328;
        white-space: pre-wrap;
      }
      a { color: #0969da; }
      .t-user, .t-path, .t-key, .t-accent, .t-hl { color: #1f2328; }
      .t-dim { color: #656d76; }
    }
  </style>
</head>
<body>
  {{ content }}

  <script>
    // 1. Ubah tautan .md menjadi .html di GitHub Pages
    document.querySelectorAll('a[href]').forEach(link => {
      const href = link.getAttribute('href');
      if (href && !href.startsWith('http') && href.endsWith('.md')) {
        if (href.endsWith('README.md')) {
          link.setAttribute('href', '{{ "/" | relative_url }}');
        } else {
          link.setAttribute('href', href.replace(/\.md$/, '.html'));
        }
      }
    });

    // 2. Lazy loading gambar & screenshot (baru dimuat saat terlihat / <details> dibuka)
    document.querySelectorAll('img').forEach(img => {
      if (!img.hasAttribute('loading')) {
        img.setAttribute('loading', 'lazy');
      }
      img.setAttribute('decoding', 'async');
    });

    // 3. Progressive streaming untuk video (hanya ambil metadata & frame awal dulu)
    document.querySelectorAll('video').forEach(video => {
      if (!video.hasAttribute('preload')) {
        video.setAttribute('preload', 'metadata');
      }
    });
  </script>
</body>
</html>
